<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Diagramforce is a free, browser-based editor purpose-built for creating diagrams covering all project needs. It supports architecture, data modeling and mapping, processes with BPMN, org charts, Gantt timelines, and UML sequence diagrams. Everything runs locally in your browser. No sign-up, no server, no data leaves your machine.">
  <meta name="theme-color" content="#1D73C9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#DA4E55" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; child-src 'none';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Diagramforce</title>
  <meta property="og:title" content="Diagramforce">
  <meta property="og:description" content="Diagramforce is a free, browser-based editor purpose-built for creating diagrams covering all project needs.">
  <meta property="og:image" content="https://diagramforce.mateuszdabrowski.pl/assets/og-image.png">
  <meta property="og:url" content="https://diagramforce.mateuszdabrowski.pl">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Diagramforce">
  <meta name="twitter:description" content="Diagramforce is a free, browser-based editor purpose-built for creating diagrams covering all project needs.">
  <meta name="twitter:image" content="https://diagramforce.mateuszdabrowski.pl/assets/og-image.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css?v=1.15.7">
  <link rel="stylesheet" href="css/theme.css?v=1.15.7">
  <link rel="stylesheet" href="css/layout.css?v=1.15.7">
  <link rel="stylesheet" href="css/toolbar.css?v=1.15.7">
  <link rel="stylesheet" href="css/stencil.css?v=1.15.7">
  <link rel="stylesheet" href="css/properties.css?v=1.15.7">
  <link rel="stylesheet" href="css/tabs.css?v=1.15.7">
  <link rel="stylesheet" href="css/canvas.css?v=1.15.7">
  <link rel="stylesheet" href="css/modals.css?v=1.15.7">
</head>
<body>
  <h1 class="df-visually-hidden">Diagramforce — Salesforce architecture diagram editor</h1>
  <a href="#canvas-container" class="df-skip-link">Skip to diagram canvas</a>
  <div id="a11y-live" class="df-visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <section id="a11y-outline" class="df-visually-hidden" aria-label="Diagram outline"></section>
  <div id="slds-icons" style="display:none" aria-hidden="true"></div>
  <div id="app" class="df-app">
    <header id="toolbar" class="df-toolbar">
      <div class="df-toolbar__left">
        <a href="https://mateuszdabrowski.pl" target="_blank" rel="noopener" class="df-toolbar__brand">
          <img src="assets/logo.png" class="df-toolbar__brand-logo" alt="Diagramforce logo" width="32" height="32">
          <span class="df-toolbar__brand-text">Diagramforce</span>
        </a>
      </div>
    </header>
    <div id="tab-bar" class="df-tabs">
      <button id="btn-close-tabs" class="df-tabs__close-multi" title="Close multiple tabs" aria-label="Close multiple tabs">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.8 9.5a1 1 0 0 0 1 .9h4.4a1 1 0 0 0 1-.9L12 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 7v5M9.5 7v5" stroke-linecap="round"/></svg>
      </button>
      <div id="tab-list" class="df-tabs__list"></div>
      <button id="btn-new-tab" class="df-tabs__new" title="New diagram">
        <svg width="12" height="12" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <span>New</span>
      </button>
    </div>
    <div class="df-main">
      <aside id="properties-panel" class="df-properties df-properties--hidden" aria-label="Properties panel">
        <div class="df-drag-handle" data-target="properties-panel"></div>
        <div class="df-properties__header">
          <div class="df-properties__title-wrap">
            <span id="properties-type" class="df-properties__type-badge"></span>
            <span id="properties-title" class="df-properties__title">Properties</span>
          </div>
          <button id="btn-close-properties" class="df-toolbar__button" title="Close inspector" aria-label="Close inspector">
            <svg class="df-toolbar__icon" aria-hidden="true"><use href="#close"></use></svg>
          </button>
        </div>
        <div id="properties-body" class="df-properties__body"></div>
        <div id="properties-footer" class="df-properties__footer"></div>
      </aside>
      <main id="canvas-container" class="df-canvas" role="main" aria-label="Diagram canvas">
        <div id="paper"></div>
        <div id="canvas-empty" class="df-canvas-empty" aria-hidden="true">
          <p class="df-canvas-empty__caption">Drag a shape from the sidebar to start →</p>
        </div>
        <div id="mapping-table-view" class="df-table-view" hidden aria-label="Field mapping table"></div>
      </main>
      <aside id="stencil-panel" class="df-stencil" aria-label="Component stencil">
        <div class="df-drag-handle" data-target="stencil-panel"></div>
        <div class="df-stencil__header">
          <div class="df-stencil__search-wrap">
            <input type="search" id="stencil-search" class="df-stencil__search" placeholder="Search components..." aria-label="Search components">
            <button id="btn-stencil-search-clear" type="button" class="df-stencil__search-clear" aria-label="Clear search" title="Clear search" hidden>×</button>
          </div>
        </div>
        <div id="stencil-categories" class="df-stencil__body"></div>
      </aside>
    </div>
  </div>
  <div id="load-modal" class="df-modal df-modal--hidden" role="dialog" aria-modal="true" aria-labelledby="load-modal-title">
    <div id="load-modal-overlay" class="df-modal__overlay"></div>
    <div class="df-modal__dialog">
      <div class="df-modal__header">
        <h2 id="load-modal-title" class="df-modal__title">Load Diagram</h2>
        <button id="btn-close-load-modal" class="df-toolbar__button" aria-label="Close">
          <svg class="df-toolbar__icon" aria-hidden="true"><use href="#close"></use></svg>
        </button>
      </div>
      <div id="load-modal-list" class="df-modal__body"></div>
    </div>
  </div>
  <div id="about-modal" class="df-modal df-modal--hidden" role="dialog" aria-modal="true" aria-labelledby="about-modal-title">
    <div id="about-modal-overlay" class="df-modal__overlay"></div>
    <div class="df-modal__dialog df-about">
      <div class="df-modal__header">
        <h2 id="about-modal-title" class="df-modal__title">About Diagramforce</h2>
        <button id="btn-close-about" class="df-toolbar__button" aria-label="Close">
          <svg class="df-toolbar__icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
      <div class="df-modal__body df-about__body">
        <div class="df-about__logo"><img src="assets/logo.png" alt="Diagramforce" width="64" height="64"></div>
        <p class="df-about__tagline">Visual Salesforce architecture diagramming tool</p>
      </div>
    </div>
  </div>
  <input type="file" id="file-input" accept=".json" multiple style="display:none" aria-label="Import JSON file">
  <script defer src="assets/vendor/joint.min.js?v=1.15.7"></script>
  <script defer src="assets/vendor/pako.min.js?v=1.15.7"></script>
  <script type="module" src="js/app.js?v=1.15.7"></script>
</body>
</html>
